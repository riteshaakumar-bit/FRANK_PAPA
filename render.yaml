services:
  - type: web
    name: aru-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python aru_bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: APP_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
